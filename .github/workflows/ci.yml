name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Primary acceptance: the released contracts, read natively. No Python, no pip, no
  # reference toolkit anywhere in this job - the only inputs are the Julia runtime, this
  # repository, its registered package dependencies and a read-only checkout of the
  # specification's language-neutral conformance data at the released tag. The bundled-
  # schema audit that used to be a python3 step now runs inside Pkg.test (src/audit.jl).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12', '1']
    env:
      RECEIPT: ${{ github.workspace }}/receipt-test.properties
    steps:
      - uses: actions/checkout@v4

      # The acceptance vectors come from the specification at a RELEASED TAG,
      # never main (shared family rule).
      - name: Check out FAIR-bioHeaders-Specification v0.6.0
        uses: actions/checkout@v4
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: v0.6.0
          path: .spec-v0.6.0

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Assert the acceptance path is native
        run: |
          # This job's acceptance path is Julia only: the runtime, this repository's
          # sources, registered Julia packages and language-neutral vector data. The
          # check is that nothing in the build or the tests can invoke another
          # implementation: no Python bridge, no subprocess runner in src/ or the test
          # entry point, no foreign project file in the tree that a test could reach
          # for, and no foreign interpreter invoked by any step of this job.
          # scripts/ is excluded: it holds the supplemental differential, which runs
          # only in its own labelled job and gates nothing.
          set -e
          if grep -rnE "PyCall|PythonCall|pyimport|CondaPkg|ccall.*libpython|readprocess|Base\.spawn|\brun *\\(" src/ test/runtests.jl ; then
            echo "^ native acceptance must not shell out to, embed or load another implementation" >&2
            exit 1
          fi
          for f in requirements.txt pyproject.toml setup.py environment.yml Pipfile package.json pom.xml build.gradle Cargo.toml DESCRIPTION go.mod; do
            if [ -e "$f" ]; then
              echo "unexpected foreign project file in a Julia library: $f" >&2
              exit 1
            fi
          done
          if awk '/^  test:/,/^  differential:/' .github/workflows/ci.yml \
             | grep -nE "^\s*(uses|run):.*(python|pip|conda)" ; then
            echo "^ the primary job must not invoke a foreign interpreter; the differential job is separate" >&2
            exit 1
          fi
          echo "no interpreter bridge, no foreign project files, no foreign interpreter step in the primary job"

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Test (rule tests + native bundle audit + shared conformance vectors)
        env:
          FAIRBIOHEADERS_CONFORMANCE: ${{ github.workspace }}/.spec-v0.6.0/conformance
          FAIRBIOHEADERS_RECEIPT: ${{ env.RECEIPT }}
        run: |
          set -o pipefail
          julia --project=. -e 'using Pkg; Pkg.test(; coverage = true)' 2>&1 | tee test-output.log

      - name: Assert the acceptance receipt says the vectors actually ran
        run: |
          # A green build is not acceptance on its own: the receipt written by the test
          # run states the counts, and the run is only accepted when every number is
          # the declared one. Missing receipt = the suite crashed or the writer is gone.
          set -e
          receipt=${RECEIPT:?}
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - Pkg.test did not complete" >&2
            exit 1
          fi
          cat "$receipt"
          for pair in conformanceSuiteUsed=true suiteVectors=291 vectorsDecided=228 \
                      vectorsPassed=228 vectorsFailed=0 vectorsUndecided=63 \
                      historicalVectorsPassed=159 policyDeltaVectors=69 policyDeltaVectorsPassed=69 \
                      compressedVectorsDecided=11 jsonldUndecided=37 microdataUndecided=26 \
                      schemaAuditFindings=0 draftPinFindings=0 assertionsFailed=0 assertionsErrored=0 \
                      assertionsBroken=0 assertionsOther=0; do
            key=${pair%%=*}; want=${pair##*=}
            got=$(sed -n "s/^$key=//p" "$receipt")
            if [ "$got" != "$want" ]; then
              echo "$key=$got, expected $want" >&2
              exit 1
            fi
          done
          # Zero-test floor: the self-contained rule layers plus the native audit plus
          # the vector assertions measured 87 on 2026-11-14; the draft-lane testset
          # brought the measured total to 147 on 2026-11-15, and the re-pin the same
          # day - which added the overlay's closed citation/version pair controls -
          # measured 151. The floor sits just below
          # so a vanished layer fails. Raise deliberately with the suite.
          floor=140
          passed=$(sed -n 's/^assertionsPassed=//p' "$receipt")
          if [ "${passed:-0}" -lt "$floor" ]; then
            echo "only ${passed:-0} assertions passed (floor $floor)" >&2
            exit 1
          fi
          echo "receipt complete: ${passed} assertions passed; every vector count as declared"

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-reports-julia${{ matrix.julia-version }}
          path: |
            test-output.log
            receipt-test.properties
          if-no-files-found: error

  # Supplemental and explicitly NOT acceptance: a differential against the released
  # reference toolkit, kept as an independent second opinion on the native result. It
  # compares, file by file and YAML text by YAML text, and fails on any disagreement, so a
  # divergence is visible on every PR; continue-on-error keeps a broken oracle from masking
  # or faking the native verdict, which the primary job alone decides.
  differential:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out FAIR-bioHeaders-Specification v0.6.0
        uses: actions/checkout@v4
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: v0.6.0
          path: .spec-v0.6.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Install the reference toolkit and this package
        run: |
          python -m pip install fair-bioheaders==0.12.0
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Bundled-schema provenance audit (independent Python implementation)
        run: python3 scripts/check_bundled_schemas.py

      - name: Frozen-toolkit verdict differential with exact D9 policy deltas
        run: |
          # Every FASTA, GFA, FHP and FHGFF3 vector and example file: this package's
          # verify_file against fhr-fasta-validate / fhr-gfa-validate / fhr-gff3-validate.
          julia --project=. scripts/differential/verdicts.jl .spec-v0.6.0/conformance .spec-v0.6.0/examples

      - name: Frozen-toolkit YAML differential with explicit D10 lexer-bound deltas
        run: |
          # Curated edge cases, random strings over YAML's indicator characters and random
          # nested documents: read_fhr_header against bioheaders.load_yaml with its record
          # checks (the same value, or both reject).
          python3 scripts/differential/compare_yaml.py --self-test
          python3 scripts/differential/gen_cases.py "$RUNNER_TEMP/cases.json" "${{ github.run_id }}" 6000 4000
          python3 scripts/differential/py_yaml.py "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/py.json"
          julia --project=. scripts/differential/yaml_cases.jl "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/jl.json"
          python3 scripts/differential/compare_yaml.py "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/py.json" "$RUNNER_TEMP/jl.json"

  # Rule V7 draft lane, labelled DRAFT and explicitly NOT acceptance. This job never
  # touches the 291-vector ledger: FHT and FHGM have no released contract, so their
  # development suites run in their own job, against the bytes and the suite revisions
  # `drafts/provenance.json` pins, and a pass here is "the pinned draft bytes behave
  # through this lane", never "this type is supported" (docs/CAPABILITY-MATRIX.md).
  # It stays native: Julia and curl of public repositories only, no Python.
  draft-lane:
    name: Draft lane against the owning repositories' development suites (labelled draft, not acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECEIPT: ${{ github.workspace }}/receipt-draft-lane.properties
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Read the pinned draft commits out of this build's own registry
        id: pins
        run: julia --project=. scripts/draft_pins.jl --github-output

      # Unauthenticated clones: the two owning repositories are public, and a full
      # clone works whether or not the pinned commit is reachable from their default
      # branch. Nothing here writes to them, and no credential is passed.
      - name: Clone the two owning repositories and check out the CONTRACT commits
        run: |
          git clone --quiet "https://github.com/FAIR-bioHeaders/${{ steps.pins.outputs.fht-repo }}" .upstream/FHT-Specification
          git -C .upstream/FHT-Specification checkout --detach --quiet "${{ steps.pins.outputs.fht-commit }}"
          git clone --quiet "https://github.com/FAIR-bioHeaders/${{ steps.pins.outputs.fhgm-repo }}" .upstream/FHGM-Specification
          git -C .upstream/FHGM-Specification checkout --detach --quiet "${{ steps.pins.outputs.fhgm-commit }}"
          git -C .upstream/FHT-Specification rev-parse HEAD
          git -C .upstream/FHGM-Specification rev-parse HEAD

      - name: Confirm the checked-out draft bytes are the bytes this build pins
        run: |
          julia --project=. scripts/draft_pins.jl --check-contract .upstream/FHT-Specification FHT
          julia --project=. scripts/draft_pins.jl --check-contract .upstream/FHGM-Specification FHGM

      # Round-13 coordinated re-pin, measured 2026-11-18: contract and suite claims
      # coincide at the pinned files' last-touch commits - FHT 86438f21 (82 vectors)
      # and FHGM 06176262 (62 vectors); the transport overlay's own last-touch is
      # 019bc29e, and its bytes are unchanged through the FHGM head. Every pinned
      # digest reproduces byte-identically at its recorded commit; the job's guards
      # below re-confirm that. No adoption or publication follows from this job.
      - name: Move each checkout to the SUITE revision its pin names
        run: |
          set -eu
          move() {
            dir=$1; rev=$2
            if [ -n "$rev" ] && [ "$rev" != "$(git -C ".upstream/$dir" rev-parse HEAD)" ]; then
              git -C ".upstream/$dir" fetch --quiet origin "$rev" || true
              git -C ".upstream/$dir" checkout --detach --quiet "$rev"
            fi
            echo "$dir at $(git -C ".upstream/$dir" rev-parse HEAD)"
          }
          move FHT-Specification "${{ steps.pins.outputs.fht-suite-commit }}"
          move FHGM-Specification "${{ steps.pins.outputs.fhgm-suite-commit }}"

      - name: Confirm each development suite is the suite this build's pin names
        run: |
          julia --project=. scripts/draft_pins.jl --check-suite .upstream/FHT-Specification FHT
          julia --project=. scripts/draft_pins.jl --check-suite .upstream/FHGM-Specification FHGM

      # The guard above has to be shown capable of failing, or its verdict is
      # decoration. Three controls on the case-sensitive Linux runner: the pinned
      # manifest bytes are accepted; the same bytes with one character appended are
      # refused as drift (and `cmp` proves the mutation is not a no-op); and a path
      # that differs from the pinned one only in case is refused as absent, NOT
      # resolved the way a case-insensitive filesystem would silently rescue it
      # (workspace lesson 10: a green APFS run proves nothing about this control).
      - name: Negative controls for the suite-pin guard
        run: |
          set -eu
          good="$RUNNER_TEMP/suite-controls/good"
          moved="$RUNNER_TEMP/suite-controls/one-byte"
          cased="$RUNNER_TEMP/suite-controls/wrong-case"
          rm -rf "$RUNNER_TEMP/suite-controls"
          mkdir -p "$good/conformance" "$moved/conformance" "$cased/Conformance"
          cp .upstream/FHT-Specification/conformance/manifest.json "$good/conformance/manifest.json"
          cp .upstream/FHT-Specification/conformance/manifest.json "$moved/conformance/manifest.json"
          cp .upstream/FHT-Specification/conformance/manifest.json "$cased/Conformance/manifest.json"
          printf 'x' >> "$moved/conformance/manifest.json"
          if cmp -s "$good/conformance/manifest.json" "$moved/conformance/manifest.json"; then
            echo "control 2 is a vacuous no-op: the mutation changed zero bytes"
            exit 1
          fi
          julia --project=. scripts/draft_pins.jl --check-suite "$good" FHT | tee "$RUNNER_TEMP/good.log"
          grep -q "verified -" "$RUNNER_TEMP/good.log"
          if julia --project=. scripts/draft_pins.jl --check-suite "$moved" FHT > "$RUNNER_TEMP/moved.log" 2>&1; then
            echo "control 2 failed: a manifest with one extra byte was accepted as the pinned suite"
            exit 1
          fi
          grep -q "digests to" "$RUNNER_TEMP/moved.log"
          if julia --project=. scripts/draft_pins.jl --check-suite "$cased" FHT > "$RUNNER_TEMP/cased.log" 2>&1; then
            echo "control 3 failed: conformance/manifest.json resolved through a differently cased directory"
            exit 1
          fi
          grep -q "holds no" "$RUNNER_TEMP/cased.log"
          echo "suite-pin controls behaved: pinned bytes VERIFIED, one byte DRIFT, wrong case ABSENT"

      - name: Run both development suites through the lane
        run: |
          set -o pipefail
          julia --project=. scripts/draft_vectors.jl --fht .upstream/FHT-Specification --fhgm .upstream/FHGM-Specification --receipt "$RECEIPT" --verbose | tee draft-lane-evidence.txt

      - name: Assert the draft receipt is complete and separate from the 291
        run: |
          set -e
          receipt=${RECEIPT:?}
          if [ ! -s "$receipt" ]; then
            echo "missing $receipt - the draft runner did not complete" >&2
            exit 1
          fi
          cat "$receipt"
          # Measured 2026-11-18: FHT 82 pass;
          # FHGM 51 pass / 0 fail / 11 K4 not-run after native K1/K3 fixes.
          # Historical pins observed 72 and 35/0/8-of-43 respectively.
          for pair in lane=draft-not-acceptance sharedLedgerTouched=false \
                      fhtVectors=82 fhtPass=82 fhtFail=0 fhtNotRun=0 \
                      fhgmVectors=62 fhgmPass=51 fhgmFail=0 fhgmNotRun=11 fhgmNotRunRule=K4; do
            key=${pair%%=*}; want=${pair##*=}
            got=$(sed -n "s/^$key=//p" "$receipt")
            if [ "$got" != "$want" ]; then
              echo "$key=$got, expected $want" >&2
              exit 1
            fi
          done
          # The receipt must name the pins it ran under - evidence that cannot quote
          # its own revisions is not evidence.
          for key in fhtContractCommit fhtContractSha256 fhtSuiteCommit fhtSuiteManifestSha256 \
                     fhgmContractCommit fhgmContractSha256 fhgmSuiteCommit fhgmSuiteManifestSha256; do
            grep -q "^$key=[0-9a-f]" "$receipt" || { echo "receipt field $key missing or not a hex pin" >&2; exit 1; }
          done
          echo "draft-lane receipt complete: every vector the lane can score agreed, the declared hole is exactly K4, and the shared 291 ledger was not touched"

      - name: Upload the draft-lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-lane-evidence
          path: |
            draft-lane-evidence.txt
            receipt-draft-lane.properties
          if-no-files-found: error

  # Draft-pin freshness. The recorded commit and digest must be compared with what the
  # owning repository publishes now, or a pin silently becomes history that reads like
  # currency. A draft legitimately moves, so this job gates nothing: it reports drift
  # with continue-on-error and never re-pins - re-pinning is a deliberate, dated commit
  # (CONTRIBUTING.md, AGENTS.md). The report is advisory evidence about the DESCRIPTION
  # of the draft; released acceptance never depends on it, and the lane keeps reading
  # the vendored bytes whatever the answer.
  draft-pin-freshness:
    name: Draft-pin freshness against live raw main (advisory, labelled draft, not acceptance)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Compare every pinned draft target with the owning repository's live default branch
        run: |
          set -o pipefail
          # Exits 0 all current; 1 at least one DRIFT (advisory: re-pin deliberately);
          # 2 a probe was unusable - including a failed 404 control - so nothing is
          # claimed either way. Every digest is taken from a no-follow 200; a redirect
          # or a soft-200 portal page refuses the run rather than faking a drift.
          julia --project=. scripts/draft_pin_freshness.jl | tee draft-pin-freshness.txt

      - name: Upload the freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-pin-freshness
          path: draft-pin-freshness.txt
          if-no-files-found: warn
